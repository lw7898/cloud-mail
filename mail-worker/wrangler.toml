name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"			#d1数据库绑定名默认不可修改
database_name = "homewarehousehub"		#d1数据库名字
database_id = "c88fcaa8-af00-4247-a687-aed8a055c88f"		#d1数据库id

[[kv_namespaces]]
binding = "kv"			#kv绑定名默认不可修改
id = "70c71409e387436fbaee4dabd4bd7bbc"					#kv数据库id

[[r2_buckets]]
binding = "r2"			#r2对象存储绑定名默认不可修改
bucket_name = "homewarehousehub"		#r2对象存储桶的名字

[[send_email]]
name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]	#每天晚上12点执行每日任务,刷新分析缓存


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
domain = ["homewarehousehub.com"]				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
admin = "admin@homewarehousehub.com"				#管理员的邮箱	示例: admin@example.com
jwt_secret = "kMpz68YBdL5GEkba2qNTItkL0jz5_jeXrA1q2liIoGM"			#jwt令牌的密钥,随便填一串字符串

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
